[project]
name = "dhruva"
version = "0.1.0"
description = "Marine decision support: reasoning onshore, answers offshore. ISRO PS 26176."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "asyncpg>=0.30",
    "redis>=5.2",
]

# Phase 2 pulls heavy wheels; keep them out of the Phase 1 image so it builds fast.
[project.optional-dependencies]
data = [
    "xarray>=2024.10",
    "dask[array]>=2024.10",
    "zarr>=2.18",
    "netCDF4>=1.7",
    "cftime>=1.6",
    "numpy>=1.26",
    "requests>=2.32",
    "certifi>=2024.8",
    "pyyaml>=6.0",
]
geo = [
    "shapely>=2.0",
    "pyproj>=3.7",
    "geopandas>=1.0",
    "sqlalchemy[asyncio]>=2.0",
]
graph = [
    "langgraph>=0.2.45",
    "langchain-core>=0.3",
    # The CLI is what serves the graph to Studio: `langgraph dev`.
    "langgraph-cli[inmem]>=0.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.386",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dhruva"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001/RUF002 guard against homoglyphs pasted in by accident. The firewall
# handles twelve languages, so Tamil and Devanagari digits in its docstrings and
# the Arabic decimal separator in its number pattern are the subject matter, not
# a typo. Flagging them here would mean deleting the thing being described.
"dhruva/evidence/firewall.py" = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # zarr v3 has no consolidated-metadata spec yet; we read our own cache, so it is safe.
    "ignore:Consolidated metadata is currently not part in the Zarr format 3:UserWarning",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["dhruva"]
