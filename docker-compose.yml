name: dhruva

services:
  postgres:
    # Carries PostGIS, pgvector and TimescaleDB in one engine.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dhruva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dhruva}
    volumes:
      - pgdata:/home/postgres/pgdata
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Host-side only. Containers always talk to postgres:5432 internally.
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhruva} -d ${POSTGRES_DB:-dhruva}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dhruva}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dhruva}
      REDIS_URL: redis://redis:6379/0
      ENV: dev
    volumes:
      - ./backend:/app
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    ports:
      - "${CADDY_HOST_PORT:-8081}:80"
    depends_on:
      - api

  # Observability. Heavier than the rest, so it is opt-in:
  #   docker compose --profile obs up -d
  langfuse:
    image: langfuse/langfuse:2
    profiles: ["obs"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-dhruva}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env}
      SALT: ${LANGFUSE_SALT:?set in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env}
      TELEMETRY_ENABLED: "false"
    ports:
      - "${LANGFUSE_HOST_PORT:-3000}:3000"
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  caddydata:
